defaults:
  - problem: heat_1d
  - model: fno_small
  - training: physics
  - _self_

seed: 42
device: auto  # auto | cpu | cuda | cuda:N

hydra:
  run:
    dir: workspace/outputs/${problem.name}/${problem.inputs}-${problem.output_param}/${training.mode}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
