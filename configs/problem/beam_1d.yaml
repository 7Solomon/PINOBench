# Simply supported Euler-Bernoulli beam, mixed form: M'' = -q, w'' = -M / EI on x in [0, 1]
# w = M = 0 at both supports. Load q(x) = q0 + q1 x.
name: beam_1d
q0_low: 0.0
q0_high: 1.0
q1_low: 0.0
q1_high: 1.0
stiffness_low: 0.5   # EI / EI_ref
stiffness_high: 2.0

# Reference values: x = x_hat L, q = q_hat q_ref, EI = EI_hat EI_ref,
# w = w_hat q_ref L^4 / EI_ref, M = M_hat q_ref L^2. Gives deflections of about 1-25 mm.
length: 5.0          # m
load_ref: 10.0       # kN/m
stiffness_ref: 1.0e4 # kNm^2

# Variants (see README). Defaults reproduce the original benchmark.
inputs: linear               # linear | sine (configs/problem/beam_1d_sine.yaml)
output_param: constrained    # constrained | unscaled | direct (data mode only) | soft
# Global output constants c for unscaled and direct: RMS of w and M over 200 000 samples of
# this input family on 64 points (0.0075 and 0.0741), rounded.
output_scale_global: [0.0075, 0.075]

# Weight of the boundary penalty L_bc (output_param=soft only), from the soft pilot
# (docs/SoftConstraintPilot.md): physics with bc = 100 beat 1 and 10.
loss_weights:
  bc: 100.0

train_resolution: 64
test_resolution: 64
resolution_study: [32, 64, 128, 256]
