# dT/dt = a * d2T/dx2 on x in [0, 1], t in [0, t_end], T(0, t) = T(1, t) = 0
# Operator input: T0(x) = sum_{n=1..N} b_n sin(n pi x), b_n ~ U(coeff_low, coeff_high)
name: heat_1d
a: 1.0
t_end: 0.1
n_series: 5
coeff_low: -1.0
coeff_high: 1.0

# Variants (see README). Defaults reproduce the original benchmark.
inputs: sine                 # sine
output_param: constrained    # constrained | unscaled | direct (data mode only)
output_scale_global: null    # c per output channel for unscaled and direct; null = 1

# Weight of the boundary penalty L_bc (output_param=soft only), from the soft pilot
# (docs/SoftConstraintPilot.md): physics with bc = 1 beat 10 and 100 (26 % rel. L2).
loss_weights:
  bc: 1.0

train_resolution: 64
test_resolution: 64
resolution_study: [32, 64, 128, 256]
