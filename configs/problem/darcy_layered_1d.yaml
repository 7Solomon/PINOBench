# Two-layer Darcy flow: -(k(x) h')' = 0 on x in [0, 1], h(0) = 1, h(1) = 0
# k = k1 for x < x_s and k2 for x >= x_s, k1 and k2 log-uniform.
name: darcy_layered_1d
k_low: 0.1           # k / k_ref
k_high: 10.0
interface_low: 0.3   # x_s
interface_high: 0.7

# Reference values: x = x_hat L, h = h_hat * head_drop, k = k_hat k_ref (k_ref = 1e-5 m/s).
# The head is linear in h_hat, so k_ref does not enter the solution.
length: 10.0         # m
head_drop: 1.0       # m
k_ref: 1.0e-5        # m/s

# Variants (see README). Defaults reproduce the original benchmark.
inputs: two_layer            # two_layer
output_param: constrained    # constrained | unscaled | direct (data mode only) | soft
output_scale_global: null    # c per output channel for unscaled and direct; null = 1

train_resolution: 64
test_resolution: 64
resolution_study: [32, 64, 128, 256]

# Hybrid mode only: replaces training.weights. The data loss is about 1e-7 against a physics
# loss of about 1e-4, so with 1:1 the hybrid run is physics-dominated. A command-line
# override of training.weights.<term> still wins.
# bc: weight of the boundary penalty L_bc (output_param=soft only, every mode), from the
# soft pilot (docs/SoftConstraintPilot.md): physics with bc = 100 beat 1 and 10.
loss_weights:
  physics: 1.0
  data: 300.0
  bc: 100.0
