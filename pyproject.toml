[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pino-benchmarks"
version = "0.1.0"
description = "Physics-informed Fourier Neural Operator benchmarks with analytical solutions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "neuraloperator>=2.0,<3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.7",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
